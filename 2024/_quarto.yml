project:
  type: website
  render: 
    - "*.qmd"
    - "!Municipais/Relatório*"

website:
  title: "Indicadores Censo SUAS"
#  navbar:
#    left:
#      - text: "Início"
#        href: index.qmd

  sidebar:
    - id: inicio
      contents:
        - text: "Relatório Nacional / Selecionar outro Município"
          href: index.qmd

    - id: municipais
      contents:
        - auto: Municipais

toc: true
number-sections: true

format:
  html:
#    css: styles.css
#    template-partials:
#      - title-block.html
    mainfont: "Rawline, Raleway, sans-serif"
    fontsize: 14px
    fontcolor: "#333333"
    linkcolor: "#1351B4"
    linestretch: 1.45
    backgroundcolor: "#ffffff"
    link-external-icon: true
    link-external-newwindow: true
    include-in-header:
      - text: |
          <link href="https://fonts.cdnfonts.com/css/rawline" rel="stylesheet">

crossref:
  fig-title: Gráfico     # (default is "Figure")
  tbl-title: Tabela     # (default is "Table")
  title-delim: "."      # (default is ":")
  fig-prefix: Gráfico   # (default is "Figure")
  tbl-prefix: Tabela    # (default is "Table")
#  ref-hyperlink: false # (default is true)

execute:
  echo: false
  message: false
  warning: false
  cache: false
  freeze: false

lang: pt   
# fig-cap-location: top

filters:
  - acronyms

acronyms:
  loa_title: "Lista de Abreviaturas e Siglas"
  loa_header_classes:
    - unnumbered
  loa_format: '`- **{shortname}**: {longname}`{=raw}'
  insert_loa: "end"
  sorting: alphabetical-case-insensitive
  non_existing: error
  on_duplicate: error
  keys:
    - shortname: ABNT
      longname: Associação Brasileira de Normas Técnicas
      
    - shortname: BPC
      longname: Benefício de Prestação Continuada
      
    - shortname: CRAS
      longname: Centro de Referência de Assistência Social
      
    - shortname: CREAS
      longname: Centro de Referência Especializado de Assistência Social
      
    - shortname: EV
      longname: Equipe Volante
      
    - shortname: IDConselho
      longname: Indicador de Desenvolvimento do Conselho Municipal de Assistência Social
      
    - shortname: IDCRAS
      longname: Indicador de Desenvolvimento do CRAS
      
    - shortname: IDCREAS
      longname: Indicador de Desenvolvimento do CREAS

    - shortname: LA
      longname: Liberdade Assistida
      
    - shortname: MDS
      longname: Ministério do Desenvolvimento e Assistência Social, Família e Combate à Fome

    - shortname: MSE
      longname: Medidas Socioeducativas

    - shortname: PAEFI
      longname: Serviço de Proteção e Atendimento Especializado a Famílias e Indivíduos

    - shortname: PAIF
      longname: Serviço de Proteção e Atendimento Integral à Família

    - shortname: PIA
      longname: Plano Individual de Atendimento
      
    - shortname: PSC
      longname: Prestação de Serviços à Comunidade
      
    - shortname: RMA
      longname: Registro Mensal de Atendimentos
      
    - shortname: SAGICAD
      longname: Secretaria de Avaliação, Gestão da Informação e Cadastro Único
      
    - shortname: SNAS
      longname: Secretaria Nacional de Assistência Social
      
    - shortname: SUAS
      longname: Sistema Único de Assistência Social

    - shortname: IGD
      longname: Índice de Gestão Descentralizada
